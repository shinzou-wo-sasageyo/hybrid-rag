[project]
name = "hybrid-rag-lab"
version = "0.1.0"
description = "Hybrid RAG built from scratch to understand what production retrieval actually requires — and to measure every decision."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sentence-transformers>=3.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "duckdb>=1.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
generate = ["anthropic>=0.40"]
dev = ["ruff>=0.5", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]
